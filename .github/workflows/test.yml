name: Test

on:
  # Lets release.yml run these checks on a tag before releasing it.
  workflow_call:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install requirements
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements_test.txt

      - name: Run tests with coverage
        run: |
          # Without this the step reports tee's exit status, so failing tests pass.
          set -o pipefail
          python3 -m pytest tests/ --cov=custom_components.resume_state --cov-report=term-missing | tee coverage_report.txt

      - name: Add Coverage Report to Summary
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
