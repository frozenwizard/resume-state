name: Release

# To release, set the manifest version to X.Y.Z and rename "## Unreleased" in
# CHANGELOG.md to "## vX.Y.Z (DD-MM-YYYY)", merge that, then tag that PR's merge
# commit vX.Y.Z and push the tag. Tag the merge commit, not the tip of main: later
# merges bump the manifest version. HACS installs custom_components/resume_state
# from the tagged release.
#
# A tag with a suffix, like v1.1.0-rc.1, makes a prerelease, which HACS only offers
# to users who turned on beta versions. Its notes come from the v1.1.0 section.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # First, so a missing CHANGELOG section or a mismatched version fails before
  # the checks run.
  notes:
    name: Get release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # HACS offers every release to users, so only release reviewed code.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag a commit that has been merged."
            exit 1
          fi
      - name: Check the manifest version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG%%-*}"
          manifest="$(jq -r .version custom_components/resume_state/manifest.json)"
          if [ "v$manifest" != "$version" ]; then
            echo "::error::manifest.json has version $manifest, but the tag is $TAG."
            exit 1
          fi
      - name: Get release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG%%-*}"
          awk -v version="$version" '/^## / { if (found) exit; found = ($2 == version); next } found' CHANGELOG.md > notes.md
          if ! grep -qE '^[*-] ' notes.md; then
            echo "::error::CHANGELOG.md has no \"## $version\" section, or it has no entries."
            exit 1
          fi
      - name: Upload the notes
        uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  lint:
    needs: notes
    uses: ./.github/workflows/lint.yml

  test:
    needs: notes
    uses: ./.github/workflows/test.yml

  validate:
    needs: notes
    uses: ./.github/workflows/validate.yml

  # Separate from the checks, so dependencies never run with a token that can write.
  release:
    name: Create the GitHub release
    needs: [lint, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the notes
        uses: actions/download-artifact@v8
        with:
          name: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" \
            --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
